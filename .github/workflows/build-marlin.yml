name: Build Marlin (SKR Mini E3 V3.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e STM32G0B1RE_btt

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: .pio/build/STM32G0B1RE_btt/firmware.bin
